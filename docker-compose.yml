# Portainer-ready Minecraft 1.20.1 Forge stack (IC2: Refactored + addons).
# Deploy as a Portainer stack (Git or Web editor). Set EULA=TRUE before start.
#
# Mod URLs are listed in `environment.MODS` so a Portainer Web-editor paste
# works without cloning this repo. The same list is in mods/urls.txt for
# scripts/fetch-mods.sh.

services:
  minecraft:
    image: itzg/minecraft-server:java17
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 1m
    ports:
      - "${SERVER_PORT:-25565}:25565"
    environment:
      EULA: ${EULA:-FALSE}
      TYPE: FORGE
      VERSION: "1.20.1"
      FORGE_VERSION: ${FORGE_VERSION:-47.4.20}
      MEMORY: ${MEMORY:-5G}
      USE_AIKAR_FLAGS: ${USE_AIKAR_FLAGS:-true}
      TZ: ${TZ:-UTC}
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      MOTD: ${MOTD:-IC2 1.20.1 — /login after join}
      DIFFICULTY: ${DIFFICULTY:-normal}
      MODE: ${MODE:-survival}
      # offline-mode so cracked / unlicensed clients can join (not the Mojang EULA)
      ONLINE_MODE: "${ONLINE_MODE:-false}"
      ENFORCE_SECURE_PROFILE: "${ENFORCE_SECURE_PROFILE:-false}"
      MAX_PLAYERS: "${MAX_PLAYERS:-3}"
      VIEW_DISTANCE: ${VIEW_DISTANCE:-10}
      SIMULATION_DISTANCE: ${SIMULATION_DISTANCE:-10}
      LEVEL: ${LEVEL:-world}
      MAX_TICK_TIME: ${MAX_TICK_TIME:--1}
      ENABLE_RCON: ${ENABLE_RCON:-true}
      RCON_PASSWORD: ${RCON_PASSWORD:-ic2rcon}
      # Shared join password for friends (tell them this; Minecraft has no vanilla password).
      # First join: /login <SERVER_PASSWORD> <SERVER_PASSWORD>   later: /login <SERVER_PASSWORD>
      SERVER_PASSWORD: ${SERVER_PASSWORD:-ic2play}
      # Pinned 1.20.1 Forge jars. IC2 + addons from GitHub; others from Modrinth CDN.
      # Server Login is server-only. OptiFine is client-only (not listed here).
      # Difficulty pack: Improved Mobs, Zombie Awareness, Enhanced Celestials, The Hordes
      # + hard deps only (TenshiLib, CoroUtil, CorgiLib, Data Anchor, Atlas Lib).
      MODS: |-
        https://github.com/craftorio/ic2/releases/download/2.10.33-ex120/ic2-forge-2.10.33-ex120.jar
        https://github.com/craftorio/ic2-advanced-machines/releases/download/61.0.3/advanced_machines-61.0.3-1.20.1.jar
        https://github.com/craftorio/ic2-advanced-solar-panels/releases/download/4.3.1/advanced_solar_panels-4.3.1-1.20.1.jar
        https://cdn.modrinth.com/data/u6dRKJwZ/versions/9jqubC9n/jei-1.20.1-forge-15.56.0.205.jar
        https://cdn.modrinth.com/data/lfHFW1mp/versions/HWDC99DO/journeymap-forge-1.20.1-6.0.7.jar
        https://cdn.modrinth.com/data/HaOHFq81/versions/hfNV8isR/serverlogin-1.0.3.jar
        https://cdn.modrinth.com/data/P2rffivS/versions/5elJ9ZTS/tenshilib-1.20.1-1.7.6-forge.jar
        https://cdn.modrinth.com/data/23MovWyi/versions/hQPzm4z2/improvedmobs-1.20.1-1.13.7-forge.jar
        https://cdn.modrinth.com/data/rLLJ1OZM/versions/6rPDKAT8/coroutil-forge-1.20.1-1.3.7.jar
        https://cdn.modrinth.com/data/mMTOWOaA/versions/vmo9rLxO/zombieawareness-1.20.1-1.13.1.jar
        https://cdn.modrinth.com/data/ziOp6EO8/versions/OtJzHtsl/Corgilib-Forge-1.20.1-4.0.3.6.jar
        https://cdn.modrinth.com/data/z2XEADmE/versions/ybaOCLNa/Data_Anchor-forge-1.20.1-1.0.0.23.jar
        https://cdn.modrinth.com/data/2rL16t1O/versions/FU1k4KeY/Enhanced-Celestials-forge-1.20.1-5.0.3.3.jar
        https://cdn.modrinth.com/data/G6VHtQr4/versions/PKJi0BrP/Atlas%20Lib-1.20.1-1.1.12.jar
        https://cdn.modrinth.com/data/O3HDffUR/versions/WMyMpstF/The-Hordes-1.20.1-1.6.3i-all.jar
    volumes:
      - minecraft-data:/data
      - minecraft-world:/data/world
      - minecraft-mods:/data/mods
      - minecraft-config:/data/config
      - minecraft-logs:/data/logs

volumes:
  minecraft-data:
    name: ${VOLUME_PREFIX:-mc-ic2}-data
  minecraft-world:
    name: ${VOLUME_PREFIX:-mc-ic2}-world
  minecraft-mods:
    name: ${VOLUME_PREFIX:-mc-ic2}-mods
  minecraft-config:
    name: ${VOLUME_PREFIX:-mc-ic2}-config
  minecraft-logs:
    name: ${VOLUME_PREFIX:-mc-ic2}-logs
